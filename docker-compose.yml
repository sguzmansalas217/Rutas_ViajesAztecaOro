# ============================================================================
#  Monitoreo de Rutas — Nexori System
#
#  Cuatro contenedores. Postgres y Redis viven en una red INTERNA sin salida
#  a internet y sin puertos publicados: sólo el API los alcanza.
#  Nginx es lo único expuesto al mundo.
#
#  Desarrollo:  docker compose up -d
#  Producción:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================================
name: monitoreo-rutas

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitoreo}
      POSTGRES_USER: ${POSTGRES_USER:-monitoreo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - datos_db:/var/lib/postgresql/data
      - ./respaldos:/respaldos
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitoreo} -d ${POSTGRES_DB:-monitoreo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    # AOF: si se reinicia el droplet no se pierden los envíos encolados.
    command: redis-server --appendonly yes --save ""
    volumes:
      - datos_redis:/data
    networks: [interna]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./app
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-monitoreo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-monitoreo}
      REDIS_URL: redis://redis:6379
      TZ: ${TZ:-America/Mexico_City}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [interna, publica]
    volumes:
      - ./subidas:/app/subidas

  trabajador:
    build: ./app
    restart: always
    command: ["node", "src/trabajador.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-monitoreo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-monitoreo}
      REDIS_URL: redis://redis:6379
      TZ: ${TZ:-America/Mexico_City}
    depends_on:
      api: { condition: service_started }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # También en 'publica': el trabajador necesita salir a graph.facebook.com.
    networks: [interna, publica]

  web:
    build: ./web
    restart: always
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx:/etc/nginx/conf.d:ro
      - ./infra/certs:/etc/nginx/certs:ro
      - ./infra/certbot:/var/www/certbot
    networks: [publica]

networks:
  # Sin salida a internet y sin puertos publicados: la base no se toca desde fuera.
  interna:
    internal: true
  publica:

volumes:
  datos_db:
  datos_redis:
