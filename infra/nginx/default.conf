# ============================================================================
#  Nginx — punto de entrada público.
#  Sirve el SPA y hace de proxy al API. La base y Redis NO están expuestos:
#  viven en una red interna de Docker sin salida.
# ============================================================================

# Límite de intentos al login: freno adicional al de Fastify.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Renovación de Let's Encrypt
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Todo lo demás se va a HTTPS (activo cuando ya hay certificado).
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # ── Cabeceras de seguridad ──────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "same-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    server_tokens off;

    client_max_body_size 25m;   # el Excel semanal

    # ── SPA ─────────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        limit_req zone=general burst=60 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── API ─────────────────────────────────────────────────────────────────
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://api:3000;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /api/ {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://api:3000;
        include /etc/nginx/conf.d/proxy.inc;
    }

    # ── Webhook de Meta ─────────────────────────────────────────────────────
    # Sin rate limit propio: la firma HMAC ya lo protege y Meta puede llegar
    # en ráfagas legítimas cuando 300 conductores contestan a la misma hora.
    location /webhook/ {
        proxy_pass http://api:3000;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location = /salud {
        proxy_pass http://api:3000/salud;
        include /etc/nginx/conf.d/proxy.inc;
        access_log off;
    }
}
