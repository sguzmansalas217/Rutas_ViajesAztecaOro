# ============================================================================
#  Nginx — punto de entrada público.
#  Sirve el SPA y hace de proxy al API. La base y Redis NO están expuestos:
#  viven en una red interna de Docker sin salida.
# ============================================================================

# Límite de intentos al login: freno adicional al de Fastify.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Renovación de Let's Encrypt
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Todo lo demás se va a HTTPS (activo cuando ya hay certificado).
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # ── Cabeceras de seguridad ──────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "same-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    server_tokens off;

    client_max_body_size 25m;   # el Excel semanal

    # ── SPA ─────────────────────────────────────────────────────────────────
    # El sistema cuelga de /monitoreo/ y no de la raíz: el dominio es de la
    # agencia y la raíz se deja libre para su página. El prefijo tiene que
    # coincidir con el 'base' de web/vite.config.js y con el destino del COPY
    # en web/Dockerfile; los tres se cambian juntos o no se cambia ninguno.
    root /usr/share/nginx/html;
    index index.html;

    # Mientras no haya página de la agencia, quien entre al dominio pelón
    # acaba en el sistema. El día que la haya, esto se cambia por su sitio.
    location = /          { return 301 /monitoreo/; }
    location = /monitoreo { return 301 /monitoreo/; }

    # Dirección corta del aviso de privacidad. El archivo está en
    # web/public/aviso-privacidad.html y Vite lo copia a dist/, así que se sirve
    # solo; esto es nada más para poder darla bonita. Meta rastrea esta URL para
    # publicar la app: tiene que responder sin sesión y sin redirección a login.
    location = /aviso-privacidad { return 301 /monitoreo/aviso-privacidad.html; }

    location /monitoreo/ {
        limit_req zone=general burst=60 nodelay;
        try_files $uri $uri/ /monitoreo/index.html;
    }

    location ~* \.(js|css|woff2|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── API ─────────────────────────────────────────────────────────────────
    # El API sigue escuchando en /api. El proxy_pass lleva URI, así que Nginx
    # sustituye el prefijo /monitoreo/api/ por /api/ al reenviar y el backend
    # no se entera de dónde está montado el frontend.
    location = /monitoreo/api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://api:3000/api/auth/login;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /monitoreo/api/ {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://api:3000/api/;
        include /etc/nginx/conf.d/proxy.inc;
    }

    # ── Webhook de Meta ─────────────────────────────────────────────────────
    # Sin rate limit propio: la firma HMAC ya lo protege y Meta puede llegar
    # en ráfagas legítimas cuando 300 conductores contestan a la misma hora.
    #
    # Sin diagonal final: Meta pega en /webhook a secas, y "location /webhook/"
    # NO casa con /webhook —se iba de largo al SPA y la verificación del webhook
    # respondía con el index.html—. Se queda en la raíz aposta: es una dirección
    # de máquina, no de persona, y así no depende de dónde esté montado el
    # panel. Queda también bajo /monitoreo por si algún día la raíz del dominio
    # se va a otro servidor.
    location /webhook {
        proxy_pass http://api:3000;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /monitoreo/webhook {
        proxy_pass http://api:3000/webhook;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location = /salud {
        proxy_pass http://api:3000/salud;
        include /etc/nginx/conf.d/proxy.inc;
        access_log off;
    }

    location = /monitoreo/salud {
        proxy_pass http://api:3000/salud;
        include /etc/nginx/conf.d/proxy.inc;
        access_log off;
    }
}
