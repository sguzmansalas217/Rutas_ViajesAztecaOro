# Sobrecarga para desarrollo local.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db redis api trabajador
#
# Publica los puertos de la base y del API para poder depurar desde Windows,
# y deja el frontend corriendo con Vite (npm run dev en web/).
# Usa el Postgres 16 del contenedor, NO el que tengas instalado local:
# así desarrollo y producción son la misma versión.
services:
  db:
    # 5434 y no 5432: esta máquina ya tiene un PostgreSQL 15 de Windows en el
    # 5432 y el contenedor de otro proyecto (rh-db) en el 5433. Con el puerto
    # repetido, o no arranca, o —peor— te conectas al servidor equivocado y las
    # consultas salen vacías sin decir por qué.
    ports: ["5434:5432"]
    # Hay que repetir las redes. En el compose base la base vive sólo en
    # 'interna', que es `internal: true`, y una red interna NO publica puertos:
    # el `ports` de arriba se ignoraba en silencio. Esto es SÓLO para
    # desarrollo — en el servidor la base nunca se asoma.
    networks: [interna, publica]

  redis:
    ports: ["6379:6379"]
    networks: [interna, publica]

  api:
    environment:
      NODE_ENV: development
      WA_SIMULADO: "1"
    ports: ["3000:3000"]

  trabajador:
    environment:
      NODE_ENV: development
      WA_SIMULADO: "1"
